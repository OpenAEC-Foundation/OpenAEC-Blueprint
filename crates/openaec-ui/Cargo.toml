[package]
name = "openaec-ui"
version = "0.1.0"
edition = "2021"
description = "Shared native OpenAEC desktop shell, design tokens and components"
license = "CC-BY-SA-4.0"
readme = "README.md"
include = ["src/**", "assets/fonts/**", "assets/icons/**", "assets/domain-icons/**", "assets/domain-icons-small/**", "licenses/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE.md"]

[dependencies]
iced = { version = "=0.13.1", default-features = false, features = ["tiny-skia", "svg", "image", "web-colors", "advanced", "fira-sans"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
