[package]
name = "openaec-blueprint-sdk"
version = "2026.44.0"
edition = "2021"
description = "C library of OpenAEC Blueprint: design tokens and the B2 icons for tools in any language"
license = "LGPL-3.0-only"
publish = false

[lib]
name = "openaec_blueprint"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
openaec-icons = { path = "../openaec-icons", features = ["all"] }
