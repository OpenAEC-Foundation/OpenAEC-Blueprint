*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:13px/1.35 Inter,"Segoe UI",Arial,sans-serif;color:var(--theme-text);background:#e9eaec}button,select{font:inherit}button{cursor:pointer}.designbar{height:50px;background:#272b32;color:#eee;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:2px solid #d97706}.brand{font-size:12px;font-weight:750;letter-spacing:.11em;white-space:nowrap}.designbar select,.designbar button{height:31px;border:1px solid #555b63;background:#343a43;color:#fff;padding:0 11px;border-radius:4px}.designbar select{width:230px}.designbar .hint{color:#bfc3ca;font-size:11px;margin-left:auto}.designbar a{color:#f7ba68;font-size:11px;white-space:nowrap}.shell{height:calc(100vh - 50px);min-height:550px;display:flex;flex-direction:column;background:var(--theme-bg);border:1px solid var(--theme-border)}.titlebar{height:32px;min-height:32px;background:var(--theme-bg-lighter);display:flex;align-items:center;gap:3px;padding:0 9px;border-bottom:1px solid var(--theme-border)}.quick{height:26px;min-width:26px;border:0;background:transparent;border-radius:3px;display:grid;place-items:center;color:var(--theme-accent)}.quick:hover,.iconbtn:hover{background:var(--theme-hover)}.quick img,.iconbtn img{width:16px;height:16px}.title{margin:auto;font-size:12px;color:var(--theme-accent);font-weight:600}.window{font-size:18px;color:var(--theme-text-secondary);width:28px;text-align:center}.tabs{height:28px;min-height:28px;display:flex;align-items:end;gap:2px;padding-left:0;border-bottom:1px solid var(--theme-border);overflow:auto;scrollbar-width:none}.tabs button{height:26px;padding:0 14px;border:0;background:transparent;color:var(--theme-text);white-space:nowrap;border-radius:4px 4px 0 0}.tabs button.active{background:var(--theme-accent-soft);color:var(--theme-accent);border-bottom:2px solid var(--theme-accent)}.tabs button.file{background:var(--theme-file-tab-bg);color:var(--theme-file-tab-text);font-weight:600}.ribbon{height:94px;min-height:94px;display:flex;align-items:stretch;padding:6px 8px 4px;gap:7px;overflow-x:auto;scrollbar-width:thin;background:var(--theme-bg-lighter);border-bottom:1px solid var(--theme-border)}.group{min-width:max-content;display:flex;flex-direction:column;border-right:1px solid var(--theme-ribbon-group-separator);padding-right:8px}.cmds{flex:1;display:flex;align-items:center;gap:2px}.cmd{width:76px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;background:transparent;color:var(--theme-text);border-radius:4px;font-size:11px}.cmd:hover,.cmd.selected{border-color:var(--theme-ribbon-btn-active-border);background:var(--theme-ribbon-btn-active-bg);color:var(--theme-ribbon-btn-active-text)}.cmd img{width:22px;height:22px;flex:none}.cmd span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;text-align:center;max-width:72px;line-height:1.15;min-height:25px}.groupname{text-align:center;height:16px;font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--theme-ribbon-group-label)}.docbar{height:30px;min-height:30px;background:var(--theme-docbar-bg);display:flex;align-items:end;border-bottom:1px solid var(--theme-border);padding-left:4px}.document{height:24px;padding:0 13px;border:1px solid var(--theme-border);border-bottom:0;background:var(--theme-surface);font-size:11px;color:var(--theme-text);display:flex;align-items:center;gap:20px}.document.active{color:var(--theme-accent);border-top:2px solid var(--theme-accent)}.body{flex:1;min-height:0;display:grid;grid-template-columns:240px minmax(320px,1fr) 240px}.panel{background:var(--theme-bg-lighter);overflow:auto}.left{border-right:1px solid var(--theme-border)}.right{border-left:1px solid var(--theme-border)}.paneltitle{height:24px;padding:0 4px 0 6px;display:flex;align-items:center;border-bottom:1px solid var(--theme-border);color:var(--theme-accent);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}.tree{padding:8px}.treeitem{padding:7px 8px;border-radius:4px;font-size:12px}.treeitem.sel{background:var(--theme-accent-soft);color:var(--theme-accent);border:1px solid var(--theme-ribbon-btn-active-border)}.treeitem.sub{padding-left:24px;color:var(--theme-text-secondary)}.work{position:relative;overflow:auto;background:var(--theme-content-bg)}.canvas{width:100%;height:100%;min-height:400px;display:grid;place-items:center;background:linear-gradient(0deg,rgba(54,54,62,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(54,54,62,.025) 1px,transparent 1px),var(--theme-content-bg);background-size:24px 24px}.workcard{width:min(490px,80%);padding:32px;background:var(--theme-surface);border:1px solid var(--theme-border);box-shadow:0 8px 35px #252a3210;text-align:center}.workcard img{width:42px;height:42px}.workcard h2{font-size:21px;font-weight:650;margin:14px 0 8px}.workcard p{font-size:12px;color:var(--theme-text-secondary);margin:0 0 20px}.primary{background:var(--theme-accent);color:var(--theme-accent-text);border:0;border-radius:4px;padding:10px 17px}.workspacehead{position:absolute;top:0;left:0;right:0;background:var(--theme-bg-lighter);border-bottom:1px solid var(--theme-border);height:34px;display:flex;align-items:center;padding:0 12px;gap:20px;font-size:11px;color:var(--theme-text-secondary)}.workspacehead strong{color:var(--theme-text)}.hero{width:400px;height:250px;border:2px solid var(--theme-accent);transform:skew(-9deg) rotate(-8deg);opacity:.55;display:grid;place-items:center}.hero:before{content:"";width:220px;height:130px;border:2px solid var(--theme-text-secondary);transform:rotate(20deg)}.props{padding:0 0 20px}.sectionname{background:var(--theme-docbar-bg);padding:6px 10px;font-weight:620;font-size:11px;border-bottom:1px solid var(--theme-border)}.prop{display:grid;grid-template-columns:47% 53%;font-size:11px;min-height:28px;border-bottom:1px solid var(--theme-border-subtle)}.prop span{padding:7px 9px;color:var(--theme-text-secondary)}.prop strong{font-weight:500;padding:7px 9px}.status{height:22px;min-height:22px;background:var(--theme-status-bg);color:var(--theme-status-text);display:flex;align-items:center;gap:10px;padding:0 10px;font-size:10px;border-top:1px solid var(--theme-status-border)}.status .push{margin-left:auto}.backstage{height:100%;display:grid;grid-template-columns:220px 1fr;background:var(--theme-content-bg)}.backnav{background:var(--theme-docbar-bg);padding:18px 10px}.backnav button{display:block;width:100%;text-align:left;padding:11px 13px;margin:2px 0;border:0;background:transparent;color:var(--theme-text)}.backnav button.active{background:var(--theme-accent-soft);color:var(--theme-accent);border-left:3px solid var(--theme-accent)}.backmain{padding:34px 42px}.backmain h2,.settings h2{font-size:24px;margin:0 0 8px}.backmain p,.settings p{color:var(--theme-text-secondary)}.recent{margin-top:28px;border:1px solid var(--theme-border);padding:13px 15px;max-width:580px}.settings{max-width:750px;margin:42px auto;padding:0 25px}.settingrow{display:grid;grid-template-columns:1fr 220px;align-items:center;border-bottom:1px solid var(--theme-border);padding:16px 0}.settingrow select{border:1px solid var(--theme-border);background:var(--theme-surface);color:var(--theme-text);padding:7px}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--theme-text-secondary)}.empty h2{color:var(--theme-text)}.empty img{width:44px;height:44px;opacity:.5}.reference{position:absolute;bottom:16px;left:16px;background:var(--theme-surface);border:1px solid var(--theme-border);padding:9px 12px;font-size:10px;color:var(--theme-text-secondary)}@media(max-width:900px){.designbar .hint{display:none}.body{grid-template-columns:185px minmax(280px,1fr)}.right{display:none}}@media(max-width:650px){.designbar{flex-wrap:wrap;height:auto;padding:8px}.shell{height:calc(100vh - 86px)}.body{display:block}.left,.right{display:none}.work{height:100%}.designbar select{width:180px}}

body:not([data-theme="light"]) .quick img,body:not([data-theme="light"]) .cmd img{filter:invert(1)}
.operation{width:min(590px,calc(100% - 48px));margin:65px auto;background:var(--theme-surface);border:1px solid var(--theme-border);box-shadow:0 8px 35px #252a3210;padding:25px}.operation h2{font-size:20px;margin:0 0 8px}.operation p{color:var(--theme-text-secondary);font-size:12px}.operation .row{display:flex;align-items:center;gap:12px;margin:22px 0}.operation .row>*{flex:1}.operation select,.operation input{border:1px solid var(--theme-border);background:var(--theme-bg-lighter);color:var(--theme-text);border-radius:4px;padding:8px}.operation .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.operation .actions button:not(.primary){background:var(--theme-bg-lighter);color:var(--theme-text);border:1px solid var(--theme-border);border-radius:4px;padding:9px 16px}.progressbar{height:7px;background:var(--theme-border);border-radius:4px;overflow:hidden;margin:20px 0 8px}.progressbar:before{content:'';display:block;background:var(--theme-accent);width:62%;height:100%}.alert{border-left:4px solid var(--theme-accent)}.errorstate{border-left-color:#c74545}</style></head><body data-theme="light"><div class="designbar"><span class="brand">OPENAEC · HARMONISATIE</span><select id="studio" aria-label="Kies applicatie"></select><select id="state" aria-label="Kies scherm"><option value="workspace">Werkgebied</option><option value="start">Start</option><option value="backstage">Bestand</option><option value="settings">Instellingen</option><option value="empty">Lege toestand</option><option value="import">Import / export</option><option value="progress">Voortgang</option><option value="unsaved">Niet opgeslagen</option><option value="error">Foutmelding</option></select><select id="theme" aria-label="Kies thema"><option value="light">Blueprint Light</option><option value="forge">Deep Forge</option><option value="openaec">Night Build</option><option value="blueprint">Blueprint</option><option value="contrast">Contrast</option></select><span class="hint">18 tools · gedeelde maten, regio's, thema's en iconbetekenissen</span><a href="energy-workflow.html">Energy-werkstroom ↗</a></div><div class="shell"><div class="titlebar"><button class="quick" title="Nieuw"><img src="../assets/icons/new.svg" alt=""></button><button class="quick" title="Openen"><img src="../assets/icons/open.svg" alt=""></button><button class="quick" title="Opslaan"><img src="../assets/icons/save.svg" alt=""></button><button class="quick" title="Ongedaan maken"><img src="../assets/icons/undo.svg" alt=""></button><span class="title" id="title"></span><button class="quick" title="Instellingen" id="settingsquick"><img src="../assets/icons/settings.svg" alt=""></button><span class="window">−</span><span class="window">□</span><span class="window">×</span></div><div class="tabs" id="tabs"></div><div class="ribbon" id="ribbon"></div><div class="docbar"><div class="document active" id="docname">Projectoverzicht <span>×</span></div><div class="document">Nieuwe weergave <span>×</span></div></div><div class="body"><aside class="panel left"><div class="paneltitle" id="lefttitle"></div><div class="tree" id="tree"></div></aside><main class="work" id="work"></main><aside class="panel right"><div class="paneltitle" id="righttitle"></div><div class="props" id="props"></div></aside></div><div class="status"><span id="statusname"></span><span>·</span><span>Gereed</span><span class="push">100%</span><span>◫</span><span>◧</span></div></div>
<script>const apps=/*APP_DATA*/;const domainIcons=/*DOMAIN_ICON_DATA*/;const domainIndex=Object.fromEntries(domainIcons.map(i=>[i.id,i]));const E=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const icon=n=>'<img src="../assets/icons/'+n+'.svg" alt="">';const iconMap={'Nieuw':'new','Openen':'open','Opslaan':'save','Importeren':'import','Exporteren':'export','Zoeken':'search','Maat':'measure','Passend':'fit','Weergave':'cube','Eigenschappen':'panelright','Lagen':'panelleft','Instellingen':'settings','Help':'help'};E('studio').innerHTML=apps.map((a,i)=>'<option value="'+i+'">'+esc(a.name)+'</option>').join('');let activeTab='Start';function groups(tab){if(tab==='Start')return [['Project',['Nieuw','Openen','Opslaan']],['Gegevens',['Importeren','Exporteren']],['Navigatie',['Zoeken','Passend']],['Schermen',['Weergave','Eigenschappen']]];if(tab==='Weergave')return [['Navigatie',['Passend','Weergave','Lagen']],['Vensters',['Eigenschappen','Instellingen']]];if(tab==='Help')return [['Ondersteuning',['Help','Instellingen']]];return [[tab,['Nieuw','Openen','Maat']],['Bewerken',['Zoeken','Eigenschappen']],['Uitvoer',['Exporteren','Passend']]]}const baseGroups=groups;groups=function(tab,app){if(!['fem','bim'].includes(app.id)||['Start','Weergave','Help','Rapport'].includes(tab))return baseGroups(tab);let picks=domainIcons.filter(i=>i.domain===app.id);let wanted=app.id==='fem'?({'Geometrie':['Geometrie'],'Randvoorwaarden':['Randvoorwaarden'],'Belastingen':['Belastingen'],'Net':['Net & berekening'],'Berekenen':['Net & berekening'],'Resultaten':['Resultaten']}[tab]||[]):({'Modelleren':['Project & referenties','Bouwdelen','Bewerken & informatie'],'Documenteren':['Documentatie & coördinatie'],'Coördineren':['Documentatie & coördinatie']}[tab]||[]);picks=picks.filter(i=>wanted.includes(i.group));if(app.id==='fem'&&tab==='Net')picks=picks.filter(i=>['mesh','mesh-refine','mesh-quality'].includes(i.id.split('.')[1]));if(app.id==='fem'&&tab==='Berekenen')picks=picks.filter(i=>!['mesh','mesh-refine','mesh-quality'].includes(i.id.split('.')[1]));if(app.id==='bim'&&tab==='Documenteren')picks=picks.filter(i=>!['clash','clearance','bcf-issue','ids-check','ifc-export','revision','section-box'].includes(i.id.split('.')[1]));if(app.id==='bim'&&tab==='Coördineren')picks=picks.filter(i=>['clash','clearance','bcf-issue','ids-check','ifc-export','revision','section-box'].includes(i.id.split('.')[1]));const out=[];for(const item of picks){let group=out.find(g=>g[0]===item.group);if(!group){group=[item.group,[]];out.push(group)}group[1].push(item.id)}return out};const cmdLabel=c=>domainIndex[c]?.label||c;const cmdIcon=c=>domainIndex[c]?'<img src="'+domainIndex[c].file+'" alt="">':calcIconFiles[c]?'<img src="'+calcIconFiles[c]+'" alt="">':icon(iconMap[c]||'grid');/*CALC_RIBBON*//*GEOTECH_RIBBON*//*HEATLOSS_RIBBON*//*CALCULATIONS_RIBBON*//*REPORTS_RIBBON*/function render(){let a=apps[+E('studio').value],state=E('state').value;document.body.dataset.theme=E('theme').value;E('title').textContent=a.name+' · OpenAEC';E('statusname').textContent=a.name;E('lefttitle').textContent=a.left_panel;E('righttitle').textContent=a.right_panel;E('docname').innerHTML=esc(a.workspace)+' <span>×</span>';E('tabs').innerHTML='<button class="file" data-tab="Bestand">Bestand</button>'+a.tabs.filter(t=>t!=='Bestand').map(t=>'<button data-tab="'+esc(t)+'" class="'+(t===activeTab?'active':'')+'">'+esc(t)+(a.optional_tabs?.includes(t)?' · optioneel':'')+'</button>').join('');E('ribbon').innerHTML=groups(activeTab,a).map(([g,commands])=>'<div class="group"><div class="cmds">'+commands.map((c,i)=>'<button class="cmd '+(i===0&&g===activeTab?'selected':'')+'" title="'+esc(cmdLabel(c))+'">'+cmdIcon(c)+'<span>'+esc(cmdLabel(c))+'</span></button>').join('')+'</div><div class="groupname">'+esc(g)+'</div></div>').join('');E('tree').innerHTML=['Project',a.left_panel,'01 · '+a.workspace,'02 · Weergave'].map((x,i)=>'<div class="treeitem '+(i===1?'sel':i>1?'sub':'')+'">'+(i<2?'▾ ':'')+esc(x)+'</div>').join('');E('props').innerHTML='<div class="sectionname">Algemeen</div>'+[['Naam',a.workspace],['Type',a.name],['Status','Actief']].map(([k,v])=>'<div class="prop"><span>'+esc(k)+'</span><strong>'+esc(v)+'</strong></div>').join('')+'<div class="sectionname">Weergave</div>'+[['Schaal','100%'],['Thema',E('theme').selectedOptions[0].text],['Selectie','0 objecten']].map(([k,v])=>'<div class="prop"><span>'+esc(k)+'</span><strong>'+esc(v)+'</strong></div>').join('');let html='';if(state==='backstage')html='<div class="backstage"><div class="backnav"><button class="active">Start</button><button>Nieuw</button><button>Openen</button><button>Opslaan</button><button>Exporteren</button><button>Instellingen</button></div><div class="backmain"><h2>Welkom bij '+esc(a.name)+'</h2><p>Een gedeeld bestandsscherm voor alle OpenAEC-studio’s.</p><button class="primary">Nieuw project</button><div class="recent">Recente bestanden verschijnen hier</div></div></div>';else if(state==='settings')html='<div class="settings"><h2>Instellingen</h2><p>Dezelfde categorieën, velden en acties in iedere studio.</p><div class="settingrow"><strong>Weergavethema</strong><select><option>'+esc(E('theme').selectedOptions[0].text)+'</option></select></div><div class="settingrow"><strong>Taal</strong><select><option>Nederlands</option></select></div><div class="settingrow"><strong>Lint compact maken</strong><input type="checkbox"></div><div class="settingrow"><strong>Automatisch opslaan</strong><input type="checkbox" checked></div></div>';else if(state==='empty')html='<div class="empty"><div>'+icon('new')+'<h2>Geen document geopend</h2><p>Open of maak een '+esc(a.name)+'-project om te beginnen.</p><button class="primary">Nieuw project</button></div></div>';else if(state==='start')html='<div class="canvas"><div class="workcard">'+icon('cube')+'<h2>'+esc(a.name)+'</h2><p>Begin met een nieuw project of open een bestaand bestand.</p><button class="primary">Nieuw project</button></div></div>';else if(state==='import')html='<div class="operation"><h2>Importeren en exporteren</h2><p>Gedeeld formulier met een studiospecifiek bestandsformaat.</p><div class="row"><strong>Actie</strong><select><option>Importeren</option><option>Exporteren</option></select></div><div class="row"><strong>Formaat</strong><select><option>Projectbestand</option><option>IFC / uitwisselformaat</option></select></div><div class="row"><strong>Bestand</strong><input value="Project_01" aria-label="Bestandsnaam"></div><div class="actions"><button>Annuleren</button><button class="primary">Doorgaan</button></div></div>';else if(state==='progress')html='<div class="operation"><h2>Bezig met verwerken</h2><p>'+esc(a.workspace)+' wordt voorbereid. De status en het annuleren hebben in iedere studio dezelfde plaats.</p><div class="progressbar"></div><p>62% · Stap 3 van 5</p><div class="actions"><button>Annuleren</button></div></div>';else if(state==='unsaved')html='<div class="operation alert"><h2>Wijzigingen opslaan?</h2><p>Er zijn wijzigingen in '+esc(a.workspace)+' die nog niet zijn opgeslagen.</p><div class="actions"><button>Annuleren</button><button>Niet opslaan</button><button class="primary">Opslaan</button></div></div>';else if(state==='error')html='<div class="operation errorstate"><h2>Bestand kan niet worden geopend</h2><p>Controleer het formaat en probeer het opnieuw. Een foutmelding noemt de oorzaak en biedt herstel.</p><div class="actions"><button>Details bekijken</button><button class="primary">Opnieuw proberen</button></div></div>';else html='<div class="workspacehead"><strong>'+esc(a.workspace)+'</strong><span>Model</span><span>2D</span><span>3D</span></div><div class="canvas"><div class="hero"></div></div><div class="reference">'+esc(a.workspace)+' · geharmoniseerde werkruimte</div>';E('work').innerHTML=html;E('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='Bestand'){E('state').value='backstage'}else{activeTab=b.dataset.tab;E('state').value='workspace'}render()})}for(const id of ['studio','state','theme'])E(id).addEventListener('change',()=>{activeTab=apps[+E('studio').value].tabs.find(t=>t!=='Bestand')||'Start';render()});E('settingsquick').onclick=()=>{E('state').value='settings';render()};render();</script></body></html>
