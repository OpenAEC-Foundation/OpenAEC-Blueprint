# Icon checks for every pull request and every push to main.
#
# The B2 job builds nothing; it checks the committed B2 masters, manifest and
# hashes, and then the icon guideline in docs/iconen.md
# (scripts/check_icon_guideline.py): legibility at 16 px, not too many loose
# parts, and enough difference between icons that sit side by side in a group.
# Script hashes in the B2 manifest ignore CRLF versus LF since revision 107.
name: Icons

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icons-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Icon checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Adoptions, geometry, crate and web icons
        run: |
          python3 scripts/check_icon_adoptions.py
          python3 scripts/check_icon_geometry.py
          python3 scripts/generate_icon_crate.py --check
          python3 scripts/build_web_icons.py --check

  crate:
    name: Icon crate tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: openaec-icons with every app
        run: cargo test -p openaec-icons --features all --locked

  b2:
    name: B2 icon set and icon guideline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-icon-b2.txt
      - name: Shapely and fontTools
        run: python -m pip install --target harmonization/sources/b2-runtime -r scripts/requirements-icon-b2.txt
      - name: B2 icon set
        run: python scripts/check_icon_set_b2.py
      - name: Icon guideline (docs/iconen.md)
        run: python scripts/check_icon_guideline.py --alle
